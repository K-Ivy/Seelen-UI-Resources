<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>K-Ivy Seelen UI Resources</title>
<style>
  :root {
    --bg: #fff; --surface: #f5f5f5; --border: #e0e0e0;
    --text: #1a1a1a; --text-dim: #666; --accent: #2563eb;
    --accent-text: #fff; --warning: #dc2626; --hover: rgba(0,0,0,.05);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1a1a1a; --surface: #242424; --border: #3a3a3a;
      --text: #e5e5e5; --text-dim: #a0a0a0; --accent: #4f8fef;
      --accent-text: #0a0a0a; --warning: #f87171; --hover: rgba(255,255,255,.08);
    }
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: system-ui, sans-serif;
    background: var(--bg); color: var(--text);
    height: 100dvh; display: flex; line-height: 1.5;
  }
  .sidebar {
    width: 180px; padding: 20px 16px;
    background: var(--surface); border-right: 1px solid var(--border);
    flex-shrink: 0;
  }
  .sidebar-header {
    font-size: 16px; font-weight: 700; color: var(--accent);
    margin-bottom: 12px; text-align: center;
  }
  .btn {
    display: block; width: 100%; padding: 9px 12px; margin-bottom: 6px;
    background: var(--accent); color: var(--accent-text);
    border: none; border-radius: 8px; font-size: 13px; font-weight: 600;
    cursor: pointer; text-align: center;
  }
  .main { flex: 1; padding: 24px; overflow-y: auto; }
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(170px, 1fr));
    gap: 14px;
  }
  .card {
    padding: 10px; background: var(--surface); border: 1px solid var(--border);
    border-radius: 12px; cursor: pointer;
  }
  .card.unavailable { border-color: var(--warning); opacity: .8; cursor: not-allowed; }
  .card img {
    width: 100%; aspect-ratio: 1/1; object-fit: cover;
    border-radius: 8px; margin-bottom: 8px;
  }
  .card-title { font-size: 13px; font-weight: 600; text-align: center; margin-bottom: 4px; }
  .card-desc { font-size: 11px; color: var(--text-dim); text-align: center; }
  .context-menu {
    position: fixed; background: var(--surface); border: 1px solid var(--border);
    border-radius: 8px; padding: 4px 0; min-width: 180px; display: none;
  }
  .context-menu.show { display: block; }
  .context-menu-item { padding: 8px 16px; cursor: pointer; font-size: 13px; }
  .context-menu-item:hover { background: var(--hover); }
  .context-menu-item.disabled { opacity: .5; cursor: not-allowed; }
  .context-menu-item.disabled:hover { background: none; }
  .context-menu-divider { height: 1px; background: var(--border); margin: 4px 0; }
</style>
</head>
<body>
  <aside class="sidebar">
    <div class="sidebar-header">K-Ivy Seelen Resources</div>
    <nav id="nav"></nav>
  </aside>
  <main class="main">
    <div class="grid" id="grid"></div>
  </main>
  <div class="context-menu" id="contextMenu"></div>

  <script>
    const navItems = [
      { label: 'Wiki', url: './Web/wiki.html' },
      { label: 'Shortcut Module Creator', url: './Web/shortcut-mod-creator.html' },
    ];

    const IMG_BASE = 'https://raw.githubusercontent.com/K-Ivy/Seelen-UI-Resources/refs/heads/main/';

    const nav = document.getElementById('nav');
    nav.innerHTML = navItems
      .map(i => `<button class="btn" data-url="${i.url}">${i.label}</button>`)
      .join('');
    nav.onclick = e => {
      const url = e.target.closest('button')?.dataset.url;
      if (url) location.href = url;
    };

    const grid = document.getElementById('grid');

    fetch('./site-data.json')
      .then(r => r.json())
      .then(data => {
        const resources = data.resources;
        grid.innerHTML = resources.map(r => `
          <div class="card${r.url ? '' : ' unavailable'}" data-url="${r.url || ''}" data-title="${r.title}">
            <img src="${encodeURI(IMG_BASE + r.img)}" loading="lazy">
            <div class="card-title">${r.title}</div>
            <div class="card-desc">${r.desc}</div>
          </div>`).join('');
      });

    grid.onclick = e => {
      const card = e.target.closest('.card:not(.unavailable)');
      if (card) location.href = card.dataset.url;
    };

    // Context menu
    const DIV = '<div class="context-menu-divider"></div>';
    const menuItem = (id, label, disabled = false) =>
      `<div class="context-menu-item${disabled ? ' disabled' : ''}" id="${id}">${label}</div>`;

    const MENUS = {
      card: unavailable =>
        menuItem('ctxOpen', 'Open', unavailable) +
        menuItem('ctxNewTab', 'Open in New Tab', unavailable) +
        DIV +
        menuItem('ctxCopyLink', 'Copy Link', unavailable) +
        menuItem('ctxCopyTitle', 'Copy Title'),
      page: () =>
        menuItem('pageRefresh', 'Refresh') +
        menuItem('pageCopyUrl', 'Copy Page URL'),
    };

    const contextMenu = document.getElementById('contextMenu');
    let currentCard = null;

    document.addEventListener('contextmenu', e => {
      const card = e.target.closest('.card');
      e.preventDefault();
      currentCard = card ?? null;
      contextMenu.innerHTML = MENUS[card ? 'card' : 'page'](card?.classList.contains('unavailable'));
      contextMenu.style.left = e.clientX + 'px';
      contextMenu.style.top = e.clientY + 'px';
      contextMenu.classList.add('show');
    });

    document.addEventListener('click', () => contextMenu.classList.remove('show'));

    contextMenu.onclick = e => {
      e.stopPropagation();
      const it = e.target.closest('.context-menu-item');
      contextMenu.classList.remove('show');
      if (!it || it.classList.contains('disabled')) return;
      const url = currentCard?.dataset.url;
      const actions = {
        ctxOpen:      () => location.href = url,
        ctxNewTab:    () => window.open(url, '_blank', 'noopener'),
        ctxCopyLink:  () => navigator.clipboard.writeText(url),
        ctxCopyTitle: () => navigator.clipboard.writeText(currentCard.dataset.title),
        pageRefresh:  () => location.reload(),
        pageCopyUrl:  () => navigator.clipboard.writeText(location.href),
      };
      actions[it.id]?.();
    };
  </script>
</body>
</html>
