id: '@k-ivy/custom-pref-user'
metadata:
  displayName: "Custom User"
  author: "K-Ivy"
  description: "Replace the windows username with what you define alongside other related options and tweaks."
  tags: ['fancy-toolbar', 'user-menu', 'power-menu']
  appTargetVersion:
    - 2
    - 8
    - 0
settings:
  - group:
      header: "✦ Custom User"
      items:
        - syntax: <string>
          name: "--usr-custom-username"
          label: "● Username (Inside Quotes)"
          initialValue: '"Replace Me"'

        - syntax: <string>
          name: "--pwrmn-custom-bye"
          label: "● Power Menu Greeting (Inside Quotes)"
          initialValue: '"Goodbye"'

  - group:
      header: "✦ Tweaks"
      items:
        - syntax: <length>
          name: "--ftbr-toolbar-username-dist-pfp"
          label: "● Username Distance from the Toolbar's Profile Picture"
          initialValue: 0
          initialValueUnit: "px"

        - syntax: <string>
          name: "--win-username-visibility"
          label: "● Window's Username Visibility"
          description: "  none = hide | block = show"
          initialValue: 'none'
          options: [none, block]

        - syntax: <string>
          name: "--ftbr-pfp-visibility"
          label: "● Toolbar Profile Picture Visibility"
          description: "  none = hide | block = show"
          initialValue: 'block'
          options: [none, block]

        - syntax: <string>
          name: "--pwrmn-pfp-visibility"
          label: "● Power Menu Profile Picture Visibility"
          description: "  none = hide | block = show"
          initialValue: 'block'
          options: [none, block]
styles:
  '@seelen/fancy-toolbar': |
    /* Hide window's username */
    #\@seelen\/tb-user-menu > div > span:nth-child(3) {
      display: var(--win-username-visibility, none) !important;
    }
    #\@seelen\/tb-user-menu .ft-bar-item-content::after {
      content: var(--usr-custom-username, "");
      margin-left: var(--ftbr-toolbar-username-dist-pfp, 0px);
      white-space: nowrap !important;
      overflow: hidden !important;
      text-overflow: ellipsis !important;
    }

    /* Hide pfp */
    #\@seelen\/tb-user-menu img {
      display: var(--ftbr-pfp-visibility, block) !important;
    }
    /* Remove leftover span */
    #\@seelen\/tb-user-menu span:first-of-type {
      display: var(--ftbr-pfp-visibility, block) !important;
    }

  '@seelen/user-menu': |
    /* Hide window's username */
    .user-profile-name > span {
      display: var(--win-username-visibility, none) !important;
    }
    .user-profile-name::before {
      content: var(--usr-custom-username, "");
      flex: 1;
      white-space: normal;
      word-break: break-word;
    }

  '@seelen/power-menu': |
    /* Hide "Goodbye <name>" - it's one combined div, not seperate */
    .power-menu-bye-bye {
      font-size: 0;
    }
    .power-menu-bye-bye::after {
      content: var(--pwrmn-custom-bye, "") " " var(--usr-custom-username, "");
      font-size: 2rem;
    }

    /* Hide pfp */
    .power-menu-user-profile {
      display: var(--pwrmn-pfp-visibility, block) !important;
    }