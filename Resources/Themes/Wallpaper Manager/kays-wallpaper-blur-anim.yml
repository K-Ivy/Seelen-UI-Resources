id: '@k-ivy/wp-anim-blur'
metadata:
  displayName: "Blur - Wallpaper Switch Animation"
  author: "K-Ivy"
  tags: ['wallpaper-manager']
  appTargetVersion:
    - 2
    - 8
    - 2
settings:
  - group:
      header: "★ v1.0 ─ Provide feedback/report issues on GitHub or in #resources :"
      items:
        - syntax: <string>
          name: "--hpmba-placeholder-1"
          label: "Github"
          initialValue: "https://github.com/K-Ivy/Seelen-UI-Resources"

        - syntax: <string>
          name: "--hpmba-placeholder-2"
          label: "Discord"
          tip: "Seelen UI"
          initialValue: "https://discord.com/channels/751144791596597561/1533619443089801246"

  - group:
      header: "✦ Blur"
      items:
        - syntax: <number>
          name: "--wp-blur-transition"
          label: "╰・Duration (ms)"
          initialValue: 600
          options: [200, 300, 400, 500, 600, 700, 800, 900, 1000]
styles:
  "@seelen/wallpaper-manager": |
    .wallpaper-container {
      will-change: opacity, filter !important;

      &.rendering {
        animation: BlurK calc(var(--wp-blur-transition, 600) * 1ms) ease-out forwards !important;
      }
    }

    @keyframes BlurK {
      from {
        opacity: 0;
        filter: blur(12px);
      }
      to {
        opacity: 1;
        filter: blur(0);
      }
    }