id: '@k-ivy/wp-anim-cir-out'
metadata:
  displayName: "Cicle Out - Wallpaper Switch Animation"
  author: "K-Ivy"
  tags: ['wallpaper-manager']
  appTargetVersion:
    - 2
    - 8
    - 2
settings:
  - group:
      header: "★ v1.0 ─ Provide feedback/report issues on GitHub or in #resources :"
      items:
        - syntax: <string>
          name: "--hpmbba-placeholder-1"
          label: "Github"
          initialValue: "https://github.com/K-Ivy/Seelen-UI-Resources"

        - syntax: <string>
          name: "--hpmbba-placeholder-2"
          label: "Discord"
          tip: "Seelen UI"
          initialValue: "https://discord.com/channels/751144791596597561/1533619443089801246"

  - group:
      header: "✦ Circle Out"
      items:
        - syntax: <number>
          name: "--wp-cir-out-transition"
          label: "╰・Duration (ms)"
          initialValue: 1000
          options: [600, 700, 800, 900, 1000]
styles:
  "@seelen/wallpaper-manager": |
    .wallpaper-container {
      will-change: clip-path !important;

      &.rendering {
        animation: Cir-Out calc(var(--wp-cir-out-transition, 1000) * 1ms) cubic-bezier(0.65, 0, 0.35, 1) forwards !important;
      }
    }

    @keyframes Cir-Out {
      from {
        clip-path: circle(0% at 50% 50%);
      }
      to {
        clip-path: circle(150% at 50% 50%);
      }
    }