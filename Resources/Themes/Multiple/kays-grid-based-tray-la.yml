id: "@k-ivy/win-grid-tray-la"
metadata:
  displayName: "Grid Style Tray - Always Show Label"
  author: "K-Ivy"
  description: "Changes tray to be grid-based like windows."
  tags: ['fancy-toolbar']
  appTargetVersion:
    - 2
    - 8
    - 2
settings:
  - group:
      header: "★ v1.3 ─ Provide feedback/report issues on GitHub or in #resources :"
      items:
        - syntax: <string>
          name: "--hptral-placeholder-1"
          label: "Github"
          initialValue: "https://github.com/K-Ivy/Seelen-UI-Resources"

        - syntax: <string>
          name: "--hptral-placeholder-2"
          label: "Discord"
          tip: "Seelen UI"
          initialValue: "https://discord.com/channels/751144791596597561/1533619443089801246"

  - group:
      header: "✦ Base of the Tray"
      items:
        - group:
            header: " Padding"
            items:
              - syntax: <length>
                name: "--tray-la-padding-top"
                label: "● Top"
                initialValue: 12
                initialValueUnit: "px"

              - syntax: <length>
                name: "--tray-la-padding-bottom"
                label: "● Bottom"
                initialValue: 12
                initialValueUnit: "px"

              - syntax: <length>
                name: "--tray-la-padding-left"
                label: "● Left"
                initialValue: 12
                initialValueUnit: "px"

              - syntax: <length>
                name: "--tray-la-padding-right"
                label: "● Right"
                initialValue: 12
                initialValueUnit: "px"

        - group:
            header: " Spacing"
            items:
              - syntax: <length>
                label: "● Row"
                tip: "Space between rows"
                name: "--tray-la-row-gap"
                initialValue: 2
                initialValueUnit: "px"

              - syntax: <length>
                label: "● Column"
                tip: "Space between columns"
                name: "--tray-la-col-gap"
                initialValue: 6
                initialValueUnit: "px"

              - syntax: <number>
                label: "╰・Maximum Columns"
                tip: "How many items before wrapping to next row"
                name: "--tray-la-columns"
                initialValue: 4

  - group:
      header: "✦ Tray Items"
      items:
        - syntax: <length>
          label: "● Cell Width"
          tip: "Width of each item"
          name: "--tray-la-col-width"
          initialValue: 60
          initialValueUnit: "px"

        - syntax: <length>
          label: "● Cell Height"
          tip: "Height of each item"
          name: "--tray-la-row-height"
          initialValue: 60
          initialValueUnit: "px"

  - group:
      header: "✦ Item Labels"
      items:
        - group:
            header: " Typography"
            items:
              - syntax: <length>
                label: " ● Letter Size"
                name: "--tray-la-label-font-size"
                initialValue: 10
                initialValueUnit: "px"

              - syntax: <number>
                name: "--tray-la-label-font-weight"
                label: "● Letter Thickness"
                initialValue: 600
                options: [100, 200, 300, 400, 500, 600, 700, 800, 900]

              - syntax: <string>
                name: "--tray-la-case"
                label: "● Case"
                initialValue: "none"
                options: [none, uppercase, lowercase, capitalize]

        - group:
            header: " Constraints"
            items:
              - syntax: <length>
                label: "● Max Line Width"
                tip: "Wrap to next line after this amount"
                name: "--tray-la-label-width"
                initialValue: 56
                initialValueUnit: "px"

              - syntax: <number>
                label: "● Distance Between Lines"
                tip: "The spacing between wrapped lines"
                name: "--tray-la-label-line-height"
                initialValue: 1.4

              - syntax: <number>
                label: "● Max Lines"
                tip: "How many lines to wrap before cut off"
                name: "--tray-la-label-max-rows"
                initialValue: 2

  - group:
      header: "✦ Item Icons"
      items:
        - syntax: <length>
          label: "● Size"
          name: "--tray-la-app-icon-size"
          initialValue: 18
          initialValueUnit: "px"

        - syntax: <number>
          label: "╰・Scale on Hover"
          name: "--tray-la-app-icon-size-state"
          initialValue: 1.06

        - syntax: <string>
          label: "╰・Transition"
          name: "--tray-la-app-icon-transition"
          tip: "~~ ms/s ease, ease-in, ease-out, ease-in-out, linear, cubic-bezier(x1,y1,x2,y2)"
          initialValue: "0.3s cubic-bezier(0.33, 1, 0.68, 1)"
styles:
  "@seelen/system-tray": |
    .system-tray {
      display: inline-grid !important;
      width: max-content !important;
      /* Caps grid width to exactly N columns worth of cells + gaps + padding,
         forcing wrap after --tray-la-columns instead of stretching wider. */
      max-width: calc(
        var(--tray-la-columns, 4) * var(--tray-la-col-width, 60px) +
        (var(--tray-la-columns, 4) - 1) * var(--tray-la-col-gap, 6px) +
        var(--tray-la-padding-left, 12px) +
        var(--tray-la-padding-right, 12px)
      ) !important;
      grid-template-columns: repeat(auto-fit, var(--tray-la-col-width, 60px)) !important;
      grid-auto-rows: var(--tray-la-row-height, 60px) !important;
      row-gap: var(--tray-la-row-gap, 2px) !important;
      column-gap: var(--tray-la-col-gap, 6px) !important;
      padding:
        var(--tray-la-padding-top, 12px)
        var(--tray-la-padding-right, 12px)
        var(--tray-la-padding-bottom, 12px)
        var(--tray-la-padding-left, 12px) !important;
    }

    .system-tray-item {
      display: flex !important;
      flex-direction: column !important;
      align-items: center !important;
      justify-content: center !important;
      gap: 2px !important;
      width: 100% !important;
      height: 100% !important;
      padding: 0 !important;
    }

    .system-tray-item-icon-box {
      flex: 0 0 auto !important;
      width: var(--tray-la-app-icon-size, 18px) !important;
      height: var(--tray-la-app-icon-size, 18px) !important;
    }

    .system-tray-item-icon {
      will-change: transform;
      height: 100% !important;
      width: 100% !important;
      transition:
        transform var(--tray-la-app-icon-transition, 0.3s cubic-bezier(0.33, 1, 0.68, 1));
    }

    .system-tray-item-icon:hover {
      transform: scale(var(--tray-la-app-icon-size-state, 1.06));
    }

    .system-tray-item-label {
      flex: 0 0 auto !important;
      display: -webkit-box !important;
      -webkit-box-orient: vertical;
      -webkit-line-clamp: var(--tray-la-label-max-rows, 2);
      width: var(--tray-la-label-width, 56px) !important;
      /* Reserves full max-rows height always, even for 1-line labels - no drift between items. */
      height: calc(
        var(--tray-la-label-max-rows, 2) *
        var(--tray-la-label-font-size, 10px) *
        var(--tray-la-label-line-height, 1.4)
      ) !important;
      font-size: var(--tray-la-label-font-size, 10px) !important; 
      font-weight: var(--tray-la-label-font-weight, 600) !important;
      text-transform: var(--tray-la-case, none) !important;
      line-height: var(--tray-la-label-line-height, 1.4) !important;
      text-align: center !important;
      white-space: normal !important;
      word-break: break-word !important;
      pointer-events: none;
    }